version = "1"

[meta]
name = "Subliminal Nightfall"
author = "Michael Hamrah"
description = "A dark color scheme featuring deep purple-black backgrounds with carefully calibrated accent colors"
license = "MIT"

[palette.base.ansi.red]
base = "#bf616a"
bright = "#e2848d"
dim = "#85434a"

[palette.base.ansi.green]
base = "#a9cfa4"
bright = "#ccf2c7"
dim = "#769072"

[palette.base.ansi.yellow]
base = "#fcb832"
bright = "#ffd266"
dim = "#b48228"

[palette.base.ansi.blue]
base = "#6699cc"
bright = "#89bcef"
dim = "#476b8e"

[palette.base.ansi.magenta]
base = "#f1a5ab"
bright = "#ffc8ce"
dim = "#a87377"

[palette.base.ansi.cyan]
base = "#5fb3b3"
bright = "#82d6d6"
dim = "#427d7d"

[palette.syntax]
teal = "#9ccfd8"
blue_green = "#6699cc"
lavender = "#c4a7e7"
gray = "#7f7f7f"

[palette.ui]
background = "#03021a"
background_alt = "#0a0921"
background_elevated = "#111028"
foreground = "#e0def4"
foreground_muted = "#a0a0a0"
foreground_dim = "#7f7f7f"
selection = "#484e5b"
cursor = "#5fb3b3"
line_highlight = "#2e3239bf"

[palette.border]
border = "#484e5b"
border_variant = "#484e5b"
border_focused = "#6699cc"
border_selected = "#5fb3b3"

[[variants]]
name = "base"
alpha = 1.0

[[variants]]
name = "hazy"
alpha = 0.75
blur_radius = 20

[[variants]]
name = "cloudy"
alpha = 0.90
blur_radius = 12

[[variants]]
name = "clear"
alpha = 0.90
appearance = "transparent"

[[targets]]
id = "ghostty"
enabled = true
path = "ghostty"
out_names = { base = "subliminal-nightfall", hazy = "subliminal-nightfall-hazy", cloudy = "subliminal-nightfall-cloudy" }

[[targets]]
id = "zed"
enabled = true
path = "zed/themes"
# Single JSON file will include all variants
out_file = "subliminal-nightfall.json"

[[targets]]
id = "cursor"
enabled = true
path = "cursor/themes"
out_names = { base = "subliminal-nightfall-color-theme.json", hazy = "subliminal-nightfall-color-theme-hazy.json", cloudy = "subliminal-nightfall-color-theme-cloudy.json" }

[[targets]]
id = "neovim"
enabled = true
path = "neovim/colors"
out_names = { base = "subliminal-nightfall.lua", hazy = "subliminal-nightfall-hazy.lua", cloudy = "subliminal-nightfall-cloudy.lua" }

[[targets]]
id = "website"
enabled = true
path = "website/src/data"
out_file = "palette.json"
