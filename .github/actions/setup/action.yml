name: Subliminal Nightfall setup
description: Checkout repository, install mise-managed toolchains, and restore caches.

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Restore mise cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/mise
          ~/.cache/mise
        key: ${{ runner.os }}-mise-${{ hashFiles('.mise.toml') }}

    - name: Install mise
      shell: bash
      run: |
        if ! command -v mise >/dev/null 2>&1; then
          curl https://mise.run | sh
        fi
        echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"

    - name: Restore pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('website/pnpm-lock.yaml', 'packages/core/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install tool versions
      shell: bash
      run: mise install
