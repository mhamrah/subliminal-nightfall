name: Publish Themes and Website

on:
  push:
    branches: [ main ]
    paths:
      - 'theme.toml'
      - 'packages/core/**'
      - 'website/**'
      - 'cursor/**'
      - 'zed/**'
      - 'ghostty/**'
      - 'neovim/**'
      - 'tools/colorloom/**'
  workflow_dispatch:
    inputs:
      force_all:
        description: Force all jobs to run
        type: boolean
        default: false
      force_website:
        description: Force website build/deploy
        type: boolean
        default: false
      force_cursor:
        description: Force Cursor extension publish
        type: boolean
        default: false
      force_zed:
        description: Force Zed extension release
        type: boolean
        default: false
      force_colorloom:
        description: Force colorloom crate publish
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate versions
        run: |
          ZED_VERSION=$(grep '^version = ' extension.toml | sed 's/version = "\(.*\)"/\1/')
          CURSOR_VERSION=$(jq -r '.version' cursor/package.json)
          
          echo "Zed extension.toml version: $ZED_VERSION"
          echo "Cursor package.json version: $CURSOR_VERSION"
          
          if [ "$ZED_VERSION" != "$CURSOR_VERSION" ]; then
            echo "::error::Version mismatch detected!"
            echo "::error::  extension.toml (Zed): $ZED_VERSION"
            echo "::error::  cursor/package.json:  $CURSOR_VERSION"
            exit 1
          fi
          echo "All versions match: $ZED_VERSION"

  detect-changes:
    needs: validate-versions
    runs-on: ubuntu-latest
    outputs:
      changed_theme: ${{ steps.changed.outputs.theme }}
      changed_website: ${{ steps.changed.outputs.website }}
      changed_cursor: ${{ steps.changed.outputs.cursor }}
      changed_zed: ${{ steps.changed.outputs.zed }}
      changed_neovim: ${{ steps.changed.outputs.neovim }}
      changed_ghostty: ${{ steps.changed.outputs.ghostty }}
      changed_colorloom: ${{ steps.changed.outputs.colorloom }}
      since_success_theme: ${{ steps.since-success.outputs.theme || steps.since-success-default.outputs.theme || 'false' }}
      since_success_website: ${{ steps.since-success.outputs.website || steps.since-success-default.outputs.website || 'false' }}
      since_success_cursor: ${{ steps.since-success.outputs.cursor || steps.since-success-default.outputs.cursor || 'false' }}
      since_success_zed: ${{ steps.since-success.outputs.zed || steps.since-success-default.outputs.zed || 'false' }}
      since_success_neovim: ${{ steps.since-success.outputs.neovim || steps.since-success-default.outputs.neovim || 'false' }}
      since_success_ghostty: ${{ steps.since-success.outputs.ghostty || steps.since-success-default.outputs.ghostty || 'false' }}
      since_success_colorloom: ${{ steps.since-success.outputs.colorloom || steps.since-success-default.outputs.colorloom || 'false' }}
      force_all: ${{ steps.force-overrides.outputs.all || steps.force-defaults.outputs.all }}
      force_website: ${{ steps.force-overrides.outputs.website || steps.force-defaults.outputs.website }}
      force_cursor: ${{ steps.force-overrides.outputs.cursor || steps.force-defaults.outputs.cursor }}
      force_zed: ${{ steps.force-overrides.outputs.zed || steps.force-defaults.outputs.zed }}
      force_colorloom: ${{ steps.force-overrides.outputs.colorloom || steps.force-defaults.outputs.colorloom }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect changed paths
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            theme:
              - 'theme.toml'
            website:
              - 'website/**'
            cursor:
              - 'cursor/**'
            zed:
              - 'zed/**'
            neovim:
              - 'neovim/**'
            ghostty:
              - 'ghostty/**'
            colorloom:
              - 'tools/colorloom/**'

      - name: Find last successful publish run
        id: last-success
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const workflowId = '.github/workflows/publish.yml';
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch: 'main',
              status: 'success',
              per_page: 10
            });
            const lastRun = runs.data.workflow_runs.find(run => run.head_sha !== context.sha);
            core.setOutput('sha', lastRun ? lastRun.head_sha : '');

      - name: Detect paths since last success
        if: steps.last-success.outputs.sha != ''
        id: since-success
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.last-success.outputs.sha }}
          filters: |
            theme:
              - 'theme.toml'
            website:
              - 'website/**'
            cursor:
              - 'cursor/**'
            zed:
              - 'zed/**'
            neovim:
              - 'neovim/**'
            ghostty:
              - 'ghostty/**'
            colorloom:
              - 'tools/colorloom/**'

      - name: Default since-last-success outputs
        if: steps.last-success.outputs.sha == ''
        id: since-success-default
        run: |
          for target in theme website cursor zed neovim ghostty colorloom; do
            echo "$target=false" >> "$GITHUB_OUTPUT"
          done

      - name: Default force overrides
        id: force-defaults
        run: |
          for target in all website cursor zed colorloom; do
            echo "$target=false" >> "$GITHUB_OUTPUT"
          done

      - name: Capture workflow_dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        id: force-overrides
        run: |
          echo "all=${{ github.event.inputs.force_all == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "website=${{ github.event.inputs.force_website == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "cursor=${{ github.event.inputs.force_cursor == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "zed=${{ github.event.inputs.force_zed == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "colorloom=${{ github.event.inputs.force_colorloom == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

  website:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.force_all == 'true' ||
      needs.detect-changes.outputs.force_website == 'true' ||
      needs.detect-changes.outputs.changed_website == 'true' ||
      needs.detect-changes.outputs.since_success_website == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install website dependencies
        run: mise run install

      - name: Generate themes
        run: mise run gen

      - name: Build website
        run: mise run build:website

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  deploy-website:
    needs:
      - detect-changes
      - website
    runs-on: ubuntu-latest
    if: |
      (needs.detect-changes.outputs.force_all == 'true' ||
       needs.detect-changes.outputs.force_website == 'true' ||
       needs.detect-changes.outputs.changed_website == 'true' ||
       needs.detect-changes.outputs.since_success_website == 'true') &&
      needs.website.result == 'success' &&
      startsWith(github.ref, 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy Website to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          mise run deploy:cloudflare

  cursor:
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cursor-version.outputs.version }}
    if: |
      (needs.detect-changes.outputs.force_all == 'true' ||
       needs.detect-changes.outputs.force_cursor == 'true' ||
       needs.detect-changes.outputs.changed_cursor == 'true' ||
       needs.detect-changes.outputs.changed_theme == 'true' ||
       needs.detect-changes.outputs.since_success_cursor == 'true' ||
       needs.detect-changes.outputs.since_success_theme == 'true') &&
      needs.detect-changes.outputs.force_website != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Generate themes
        run: mise run gen

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Bump Cursor extension version
        if: needs.detect-changes.outputs.changed_theme == 'true'
        run: |
          jq '(.version) |= (split(".") | .[2] = ((.[2]|tonumber)+1 | tostring) | join("."))' cursor/package.json > cursor/package.tmp && mv cursor/package.tmp cursor/package.json

      - name: Publish VS Code / Cursor Extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: mise run publish:cursor

      - name: Commit Cursor version bump
        run: |
          if ! git diff --quiet cursor/package.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add cursor/package.json
            git commit -m "chore: bump cursor extension version" || true
            git push || echo "Push failed";
          fi

      - name: Output Cursor version
        id: cursor-version
        run: |
          VERSION=$(jq -r '.version' cursor/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  zed:
    needs:
      - detect-changes
      - cursor
    runs-on: ubuntu-latest
    if: |
      (needs.detect-changes.outputs.force_all == 'true' ||
       needs.detect-changes.outputs.force_zed == 'true' ||
       needs.detect-changes.outputs.changed_zed == 'true' ||
       needs.detect-changes.outputs.changed_theme == 'true' ||
       needs.detect-changes.outputs.changed_cursor == 'true' ||
       needs.detect-changes.outputs.since_success_zed == 'true' ||
       needs.detect-changes.outputs.since_success_theme == 'true' ||
       needs.detect-changes.outputs.since_success_cursor == 'true') &&
      (needs.cursor.result == 'success' || needs.cursor.result == 'skipped') &&
      needs.detect-changes.outputs.force_website != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Generate themes
        run: mise run gen

      - name: Determine Zed release version
        id: zedver
        env:
          CURSOR_VERSION: ${{ needs.cursor.outputs.version }}
          CHANGED_THEME: ${{ needs.detect-changes.outputs.changed_theme }}
        run: |
          VERSION=""
          SOURCE=""
          if [ -n "$CURSOR_VERSION" ]; then
            # Use cursor version (only set when theme.toml changed)
            VERSION="$CURSOR_VERSION"
            SOURCE="cursor"
          elif [ "$CHANGED_THEME" = "true" ]; then
            # Theme changed but cursor didn't run - bump zed version
            CUR=$(grep '^version = "' extension.toml | sed -E 's/^version = "([^"]+)".*/\1/')
            IFS='.' read -r MA MI PA <<< "$CUR"
            PA=$((PA + 1))
            VERSION="$MA.$MI.$PA"
            sed -E -i "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" extension.toml
            SOURCE="zed"
          else
            # No theme change - use current version without bumping
            VERSION=$(grep '^version = "' extension.toml | sed -E 's/^version = "([^"]+)".*/\1/')
            SOURCE="zed"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Commit Zed version bump
        if: steps.zedver.outputs.version != ''
        run: |
          if ! git diff --quiet extension.toml; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add extension.toml
            git commit -m "chore: sync Zed extension version" || true
            git push || echo "Push failed";
          fi

      - name: Tag Zed extension release
        if: steps.zedver.outputs.version != ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.zedver.outputs.version }}" || echo "Tag exists"
          git push origin "v${{ steps.zedver.outputs.version }}" || echo "Push tag failed"

      - name: Prepare Zed extension artifact
        if: steps.zedver.outputs.version != ''
        run: |
          VERSION="${{ steps.zedver.outputs.version }}"
          if [ "${{ steps.zedver.outputs.source }}" = "cursor" ]; then
            sed -E -i "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" extension.toml
          fi
          zip -r "zed-extension-$VERSION.zip" extension.toml zed/themes || (sudo apt-get update && sudo apt-get install -y zip && zip -r "zed-extension-$VERSION.zip" extension.toml zed/themes)

      - name: Release Zed extension asset
        if: steps.zedver.outputs.version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.zedver.outputs.version }}
          files: |
            zed-extension-${{ steps.zedver.outputs.version }}.zip

      - name: Check Zed extension configuration
        if: steps.zedver.outputs.version != ''
        run: |
          if [ -z "${{ vars.ZED_EXTENSIONS_FORK }}" ]; then
            echo "⚠️  Missing repo variable ZED_EXTENSIONS_FORK. Set it to your fork, e.g. 'mhamrah/extensions'.";
            echo "Skipping Zed extension release to extensions repo.";
            exit 0;
          fi
          if [ -z "${{ secrets.ZED_COMMITTER_TOKEN }}" ]; then
            echo "⚠️  Missing secret ZED_COMMITTER_TOKEN (requires repo + workflow scopes).";
            echo "Skipping Zed extension release to extensions repo.";
            exit 0;
          fi

      - name: Run Zed extension action
        if: steps.zedver.outputs.version != ''
        uses: huacnlee/zed-extension-action@v1
        with:
          extension-name: subliminal-nightfall
          push-to: ${{ vars.ZED_EXTENSIONS_FORK }}
          tag-name: v${{ steps.zedver.outputs.version }}
          commit-message: "Update subliminal-nightfall to v${{ steps.zedver.outputs.version }}\n\nRelease notes: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.zedver.outputs.version }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}

  colorloom:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      (needs.detect-changes.outputs.force_all == 'true' ||
       needs.detect-changes.outputs.force_colorloom == 'true' ||
       needs.detect-changes.outputs.changed_colorloom == 'true' ||
       needs.detect-changes.outputs.since_success_colorloom == 'true') &&
      needs.detect-changes.outputs.force_website != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Publish colorloom crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          mise run publish:colorloom || echo "Cargo publish skipped"
