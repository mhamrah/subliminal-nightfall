name: Publish Themes and Website

on:
  push:
    branches: [main]
    paths:
      - "theme.toml"
      - "packages/core/**"
      - "website/**"
      - "cursor/**"
      - "zed/**"
      - "ghostty/**"
      - "neovim/**"
      - "tools/colorloom/**"
  workflow_dispatch:
    inputs:
      force_all:
        description: Force all jobs to run
        type: boolean
        default: false
      force_website:
        description: Force website build/deploy
        type: boolean
        default: false
      force_cursor:
        description: Force Cursor extension publish
        type: boolean
        default: false
      force_zed:
        description: Force Zed extension release
        type: boolean
        default: false
      force_colorloom:
        description: Force colorloom crate publish
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate versions
        run: |
          ZED_VERSION=$(grep '^version = ' extension.toml | sed 's/version = "\(.*\)"/\1/')
          CURSOR_VERSION=$(jq -r '.version' cursor/package.json)

          echo "Zed extension.toml version: $ZED_VERSION"
          echo "Cursor package.json version: $CURSOR_VERSION"

          if [ "$ZED_VERSION" != "$CURSOR_VERSION" ]; then
            echo "::error::Version mismatch detected!"
            echo "::error::  extension.toml (Zed): $ZED_VERSION"
            echo "::error::  cursor/package.json:  $CURSOR_VERSION"
            exit 1
          fi
          echo "All versions match: $ZED_VERSION"

  detect-changes:
    needs: validate-versions
    runs-on: ubuntu-latest
    outputs:
      changed_theme: ${{ steps.changed.outputs.theme }}
      changed_website: ${{ steps.changed.outputs.website }}
      changed_colorloom: ${{ steps.changed.outputs.colorloom }}
      force_all: ${{ steps.force.outputs.all }}
      force_website: ${{ steps.force.outputs.website }}
      force_cursor: ${{ steps.force.outputs.cursor }}
      force_zed: ${{ steps.force.outputs.zed }}
      force_colorloom: ${{ steps.force.outputs.colorloom }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            theme:
              - 'theme.toml'
            website:
              - 'website/**'
            colorloom:
              - 'tools/colorloom/**'

      - name: Set force flags
        id: force
        run: |
          echo "all=${{ github.event.inputs.force_all == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "website=${{ github.event.inputs.force_website == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "cursor=${{ github.event.inputs.force_cursor == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "zed=${{ github.event.inputs.force_zed == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "colorloom=${{ github.event.inputs.force_colorloom == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

  # Bump versions for both cursor and zed when theme.toml changes
  bump-versions:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.changed_theme == 'true'
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump versions
        id: bump
        run: |
          # Get current version from extension.toml
          CUR=$(grep '^version = "' extension.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          IFS='.' read -r MA MI PA <<< "$CUR"
          PA=$((PA + 1))
          NEW_VERSION="$MA.$MI.$PA"

          echo "Bumping version from $CUR to $NEW_VERSION"

          # Update extension.toml
          sed -E -i "s/^version = \"[^\"]+\"/version = \"$NEW_VERSION\"/" extension.toml

          # Update cursor/package.json
          jq ".version = \"$NEW_VERSION\"" cursor/package.json > cursor/package.tmp && mv cursor/package.tmp cursor/package.json

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add extension.toml cursor/package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

  # Build and deploy website (on theme, website, or colorloom changes)
  website:
    needs: [detect-changes, bump-versions]
    if: |
      always() &&
      (needs.bump-versions.result == 'success' || needs.bump-versions.result == 'skipped') &&
      (needs.detect-changes.outputs.changed_theme == 'true' ||
       needs.detect-changes.outputs.changed_website == 'true' ||
       needs.detect-changes.outputs.changed_colorloom == 'true' ||
       needs.detect-changes.outputs.force_website == 'true' ||
       needs.detect-changes.outputs.force_all == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main || true

      - uses: ./.github/actions/setup

      - name: Install website dependencies
        run: mise run install

      - name: Generate themes
        run: mise run gen

      - name: Build website
        run: mise run build:website

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  deploy-website:
    needs: [detect-changes, website]
    if: |
      always() &&
      needs.website.result == 'success' &&
      startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy Website to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          mise run deploy:cloudflare

  # Publish Cursor extension (on theme or colorloom changes)
  cursor:
    needs: [detect-changes, bump-versions]
    if: |
      always() &&
      (needs.bump-versions.result == 'success' || needs.bump-versions.result == 'skipped') &&
      (needs.detect-changes.outputs.changed_theme == 'true' ||
       needs.detect-changes.outputs.changed_colorloom == 'true' ||
       needs.detect-changes.outputs.force_cursor == 'true' ||
       needs.detect-changes.outputs.force_all == 'true') &&
      needs.detect-changes.outputs.force_website != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main || true

      - uses: ./.github/actions/setup

      - name: Generate themes
        run: mise run gen

      - name: Publish VS Code / Cursor Extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: mise run publish:cursor

  # Publish Zed extension (on theme or colorloom changes)
  zed:
    needs: [detect-changes, bump-versions]
    if: |
      always() &&
      (needs.bump-versions.result == 'success' || needs.bump-versions.result == 'skipped') &&
      (needs.detect-changes.outputs.changed_theme == 'true' ||
       needs.detect-changes.outputs.changed_colorloom == 'true' ||
       needs.detect-changes.outputs.force_zed == 'true' ||
       needs.detect-changes.outputs.force_all == 'true') &&
      needs.detect-changes.outputs.force_website != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main || true

      - uses: ./.github/actions/setup

      - name: Generate themes
        run: mise run gen

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = "' extension.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag Zed extension release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.version.outputs.version }}" || echo "Tag exists"
          git push origin "v${{ steps.version.outputs.version }}" || echo "Push tag failed"

      - name: Prepare Zed extension artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "zed-extension-$VERSION.zip" extension.toml zed/themes || (sudo apt-get update && sudo apt-get install -y zip && zip -r "zed-extension-$VERSION.zip" extension.toml zed/themes)

      - name: Release Zed extension asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            zed-extension-${{ steps.version.outputs.version }}.zip

      - name: Check Zed extension configuration
        run: |
          if [ -z "${{ vars.ZED_EXTENSIONS_FORK }}" ]; then
            echo "⚠️  Missing repo variable ZED_EXTENSIONS_FORK. Set it to your fork, e.g. 'mhamrah/extensions'.";
            echo "Skipping Zed extension release to extensions repo.";
            exit 0;
          fi
          if [ -z "${{ secrets.ZED_COMMITTER_TOKEN }}" ]; then
            echo "⚠️  Missing secret ZED_COMMITTER_TOKEN (requires repo + workflow scopes).";
            echo "Skipping Zed extension release to extensions repo.";
            exit 0;
          fi

      - name: Run Zed extension action
        uses: huacnlee/zed-extension-action@v1
        with:
          extension-name: subliminal-nightfall
          push-to: ${{ vars.ZED_EXTENSIONS_FORK }}
          tag-name: v${{ steps.version.outputs.version }}
          commit-message: "Update subliminal-nightfall to v${{ steps.version.outputs.version }}\n\nRelease notes: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_COMMITTER_TOKEN }}

  # Publish colorloom to crates.io (only on colorloom changes)
  colorloom:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.changed_colorloom == 'true' ||
      needs.detect-changes.outputs.force_colorloom == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Publish colorloom crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not set"
            exit 1
          fi

          set -euo pipefail
          mise run publish:colorloom
